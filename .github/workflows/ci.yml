name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  current-home-assistant:
    name: Current Home Assistant
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install pinned test environment
        run: python -m pip install --requirement requirements-test.txt

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run native and property tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q custom_components tests

      - name: Validate JSON files
        run: |
          python -m json.tool custom_components/ambientika_local/manifest.json >/dev/null
          python -m json.tool custom_components/ambientika_local/strings.json >/dev/null
          python -m json.tool custom_components/ambientika_local/translations/en.json >/dev/null
          python -m json.tool custom_components/ambientika_local/translations/de.json >/dev/null

  minimum-home-assistant:
    name: Home Assistant 2024.6.4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test-minimum.txt

      - name: Install minimum supported test environment
        run: python -m pip install --requirement requirements-test-minimum.txt

      - name: Run compatibility tests
        run: python -m pytest -q

  hassfest:
    name: Home Assistant validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master 2026-08-10

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-08-10
        with:
          category: integration
