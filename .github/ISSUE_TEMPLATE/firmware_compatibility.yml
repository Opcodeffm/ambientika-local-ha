name: Firmware Compatibility Report
description: Report whether the integration works with your firmware (positive or negative)
labels: ["firmware-compat"]
body:
  - type: markdown
    attributes:
      value: |
        This integration was originally built against one specific firmware. Reports from other firmware versions — whether it just works or whether you had to tweak things — help build a compatibility matrix. Thanks!

  - type: input
    id: device-model
    attributes:
      label: Device model
      placeholder: Ambientika Smart
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: Look for the redacted device identification line in the HA log.
      placeholder: "micro=0.1.22 radio=0.0.28"
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Works out of the box
        - Works with minor issues
        - Does not work
    validations:
      required: true

  - type: textarea
    id: frame
    attributes:
      label: Status frame information
      description: Provide the observed frame length (for example 19 or 21 bytes) and an integration-generated redacted parser line. Never post a raw frame, PCAP, full device identifier, token, account email, or exact device IP.
      placeholder: "21 bytes; automatic detection works"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
    validations:
      required: false
